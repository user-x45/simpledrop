<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimpleDrop｜オフライン</title>
<meta name="robots" content="noindex, nofollow">
<link href="favicon/32.png" rel="icon" sizes="32x32" type="image/png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F6FBF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1512" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
  :root {
    color-scheme: dark light;
    --bg: #0F1512;
    --panel: #161F1B;
    --panel-raised: #1D2924;
    --accent: #7FE0B5;
    --text: #EAF2ED;
    --sub: #8FA69A;
    --line: #253128;
    --on-accent: #0F1512;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #F3F8F5;
      --panel: #FFFFFF;
      --panel-raised: #E8F1EC;
      --accent: #1F8A5F;
      --text: #14231B;
      --sub: #5B7266;
      --line: #D3E2D9;
      --on-accent: #FFFFFF;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Zen Kaku Gothic New", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 360px;
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 36px 28px;
    text-align: center;
  }
  .icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: var(--panel-raised);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: var(--accent);
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 10px;
  }
  p {
    color: var(--sub);
    font-size: 14px;
    line-height: 1.7;
    margin: 0 0 24px;
  }
  button {
    appearance: none;
    border: none;
    background: var(--accent);
    color: var(--on-accent);
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    padding: 12px 20px;
    border-radius: 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="icon"><i class="fa-solid fa-wifi-slash" aria-hidden="true"></i></div>
  <h1>オフラインです</h1>
  <p>インターネットに接続されていないため、SimpleDropを表示できません。接続を確認してからもう一度お試しください。</p>
  <button type="button" onclick="location.reload()"><i class="fa-solid fa-rotate-right"></i>再読み込み</button>
</div>
</body>
</html>
