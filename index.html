<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimpleDrop｜ブラウザでファイルを共有</title>
<meta name="description" content="同じネットワーク内の端末に、ブラウザからすばやくファイルを送れます。">
<meta name="robots" content="noindex, nofollow">
<link href="favicon/32.png" rel="icon" sizes="32x32" type="image/png">
<link href="favicon/96.png" rel="icon" sizes="96x96" type="image/png">
<link href="favicon/144.png" rel="icon" sizes="144x144" type="image/png">
<link href="favicon/180.png" rel="apple-touch-icon" type="image/png">
<link href="favicon/152.png" rel="apple-touch-icon-precomposed" type="image/png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F6FBF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1512" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    color-scheme: dark light;
    --bg: #0F1512;
    --panel: #161F1B;
    --panel-raised: #1D2924;
    --accent: #7FE0B5;
    --accent-dim: #4E8F72;
    --text: #EAF2ED;
    --sub: #8FA69A;
    --warn: #E0947F;
    --line: #253128;
    --on-accent: #0F1512;
    --accent-rgb: 127, 224, 181;
    --scrim-rgb: 15, 21, 18;
    --shadow-rgb: 0, 0, 0;
    --grad-a: #0F1512;
    --grad-b: #14261E;
    --grad-c: #0B2A25;
    --glow-alpha: 0.16;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #F3F8F5;
      --panel: #FFFFFF;
      --panel-raised: #E8F1EC;
      --accent: #1F8A5F;
      --accent-dim: #6FB596;
      --text: #14231B;
      --sub: #5B7266;
      --warn: #C4593D;
      --line: #D3E2D9;
      --on-accent: #FFFFFF;
      --accent-rgb: 31, 138, 95;
      --scrim-rgb: 20, 35, 27;
      --shadow-rgb: 20, 60, 40;
      --grad-a: #F6FBF8;
      --grad-b: #E6F3EC;
      --grad-c: #D5EBE3;
      --glow-alpha: 0.14;
    }
  }

  * { box-sizing: border-box; }

  html {
    background: var(--grad-a);
  }

  html, body {
    margin: 0;
    padding: 0;
    color: var(--text);
    font-family: "Zen Kaku Gothic New", sans-serif;
    height: 100%;
    overflow: hidden;
  }

  body {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(ellipse at 15% 0%, rgba(var(--accent-rgb), var(--glow-alpha)) 0%, transparent 55%),
      linear-gradient(160deg, var(--grad-a) 0%, var(--grad-b) 55%, var(--grad-c) 100%);
    background-attachment: fixed;
  }

  header {
    flex-shrink: 0;
    padding: 20px 24px 4px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  header h1 {
    font-size: 30px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  header h1 .site-icon {
    font-size: 26px;
    color: var(--accent);
    flex-shrink: 0;
  }

  header p {
    margin: 0;
    color: var(--sub);
    font-size: 16px;
    line-height: 1.6;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    font-size: 15px;
    color: var(--sub);
    flex-wrap: wrap;
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--warn);
    transition: background 0.4s ease;
  }

  .status-dot.connected {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  .you-name {
    color: var(--accent);
    font-weight: 500;
    cursor: pointer;
    border-bottom: 1px dashed var(--accent-dim);
  }

  .you-name:hover {
    opacity: 0.85;
  }

  .name-input {
    background: var(--bg);
    color: var(--text);
    border: 1.5px solid var(--accent-dim);
    border-radius: 8px;
    padding: 2px 8px;
    font-family: inherit;
    font-size: 15px;
    outline: none;
    width: 140px;
  }

  .transfer-warning {
    flex-shrink: 0;
    margin: 4px 24px 0;
    padding: 10px 16px;
    border-radius: 10px;
    background: rgba(var(--accent-rgb), 0.12);
    border: 1px solid var(--accent-dim);
    color: var(--text);
    font-size: 14px;
    align-items: center;
    gap: 10px;
  }

  .transfer-warning:not([hidden]) {
    display: flex;
  }

  .transfer-warning i {
    color: var(--warn);
    flex-shrink: 0;
  }

  main {
    flex: 1 1 0;
    min-height: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 20px;
  }

  #field {
    position: relative;
    width: 100%;
    max-width: 620px;
    height: 100%;
    max-height: 460px;
  }

  .empty-hint {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--sub);
    font-size: 18px;
    line-height: 1.9;
    padding: 0 16px;
    gap: 20px;
    transition: opacity 0.3s ease;
  }

  .empty-hint-text {
    pointer-events: none;
  }

  .qr-btn {
    pointer-events: auto;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--panel-raised);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 20px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: border-color 0.2s ease, transform 0.15s ease;
  }

  .qr-btn:hover {
    border-color: var(--accent-dim);
  }

  .qr-btn:active {
    transform: scale(0.96);
  }

  .qr-sheet {
    max-width: 360px;
    text-align: center;
  }

  .qr-sheet h2 {
    margin: 0 0 4px;
    font-size: 20px;
  }

  .qr-sheet .desc {
    margin: 0 0 20px;
    color: var(--sub);
    font-size: 15px;
  }

  .qr-box {
    background: #FFFFFF;
    border-radius: 16px;
    padding: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
  }

  .qr-box canvas {
    display: block;
  }

  .qr-url {
    font-size: 13px;
    color: var(--sub);
    word-break: break-all;
    margin-bottom: 20px;
  }

  .peer-node {
    position: absolute;
    width: 128px;
    height: 128px;
    margin-left: -64px;
    margin-top: -64px;
    border-radius: 50%;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    opacity: 0;
    animation: drift 6s ease-in-out infinite, fade-in 0.5s ease forwards;
    animation-delay: var(--drift-delay, 0s), 0s;
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .peer-node:hover {
    transform: scale(1.08);
    border-color: var(--accent-dim);
    box-shadow: 0 0 24px rgba(var(--accent-rgb), 0.15);
  }

  .peer-node.leaving {
    animation: vanish 0.5s cubic-bezier(0.4, 0, 1, 1) forwards;
    pointer-events: none;
  }

  .peer-node .glow {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent);
  }

  .peer-node .peer-name {
    font-size: 16px;
    font-weight: 500;
    text-align: center;
    padding: 0 4px;
    line-height: 1.3;
    white-space: nowrap;
  }

  @keyframes drift {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(0, -10px); }
  }

  .peer-node:hover { animation-play-state: paused; }

  .peer-node {
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }

  .peer-node.pressing {
    transform: scale(0.94);
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(var(--accent-rgb), 0.18), 0 0 28px rgba(var(--accent-rgb), 0.22);
    animation-play-state: paused;
  }

  @keyframes fade-in {
    from { opacity: 0; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes fade-out {
    from { opacity: 1; transform: scale(1); }
    to { opacity: 0; transform: scale(0.6); }
  }

  @keyframes vanish {
    0% {
      opacity: 1;
      filter: blur(0);
      transform: scale(1) translateY(0);
    }
    40% {
      opacity: 0.8;
      filter: blur(1px);
      transform: scale(1.05) translateY(-2px);
    }
    100% {
      opacity: 0;
      filter: blur(6px);
      transform: scale(0.4) translateY(-18px);
    }
  }

  #log {
    flex-shrink: 0;
    max-width: 620px;
    margin: 0 auto;
    width: 100%;
    max-height: 200px;
    overflow-y: auto;
    padding: 0 24px 16px;
    overscroll-behavior: contain;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  #log:empty {
    display: none;
  }

  .log-title {
    font-size: 15px;
    color: var(--sub);
    margin: 4px 0;
  }

  .transfer-card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    animation: fade-in 0.4s ease;
  }

  .transfer-close {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    color: var(--sub);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    cursor: pointer;
    padding: 0;
  }

  .transfer-close:hover {
    color: var(--text);
    border-color: var(--accent-dim);
  }

  .transfer-icon {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    background: var(--panel-raised);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: var(--accent);
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }

  .transfer-icon img,
  .transfer-icon video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: var(--panel-raised);
  }

  .transfer-icon .badge {
    position: absolute;
    right: 3px;
    bottom: 3px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: rgba(var(--scrim-rgb), 0.72);
    color: var(--text);
    font-size: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-left: 1px;
  }

  .transfer-info {
    flex: 1;
    min-width: 0;
  }

  .transfer-info .fname {
    font-size: 17px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .transfer-info .fmeta {
    font-size: 14px;
    color: var(--sub);
    margin-top: 2px;
  }

  .progress-track {
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 8px;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.15s ease;
  }

  .transfer-card.transfer-failed {
    border-color: var(--warn);
  }

  .transfer-card.transfer-failed .fmeta {
    color: var(--warn);
  }

  .transfer-card.transfer-failed .transfer-icon {
    color: var(--warn);
  }

  .progress-track.failed .progress-fill {
    background: var(--warn);
  }

  .dl-btn {
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: opacity 0.2s ease;
  }

  .dl-btn:hover { opacity: 0.85; }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(var(--scrim-rgb), 0.72);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .sheet {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
    padding: 24px 24px 32px;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.3, 1), opacity 0.3s ease;
    border-top: 1px solid var(--line);
  }

  .overlay.open .sheet {
    transform: translateY(0);
  }

  @media (min-width: 769px) {
    .overlay {
      align-items: center;
    }

    .sheet {
      max-width: 460px;
      border-radius: 24px;
      border-top: 1px solid var(--line);
      transform: translateY(24px) scale(0.97);
      opacity: 0;
    }

    .overlay.open .sheet {
      transform: translateY(0) scale(1);
      opacity: 1;
    }
  }

  .sheet-header {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: -8px -8px 10px;
    padding: 8px 8px;
    touch-action: none;
    cursor: grab;
  }

  @media (min-width: 769px) {
    .sheet-header {
      display: none;
    }
  }

  .sheet-handle {
    width: 36px;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
  }

  .sheet h2 {
    font-size: 22px;
    margin: 0 0 6px;
    font-weight: 700;
    line-height: 1.4;
  }

  .sheet .to-name {
    color: var(--accent);
  }

  .sheet p.desc {
    color: var(--sub);
    font-size: 16px;
    margin: 0 0 18px;
  }

  .drop-zone {
    border: 1.5px dashed var(--line);
    border-radius: 16px;
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent-dim);
    background: var(--panel-raised);
  }

  .drop-zone .dz-icon {
    font-size: 36px;
    margin-bottom: 10px;
    color: var(--accent);
  }

  .drop-zone .dz-text {
    font-size: 18px;
    color: var(--text);
  }

  .drop-zone .dz-sub {
    font-size: 15px;
    color: var(--sub);
    margin-top: 4px;
  }

  .sheet-close {
    display: block;
    margin: 16px auto 0;
    background: none;
    border: none;
    color: var(--sub);
    font-size: 16px;
    cursor: pointer;
    font-family: inherit;
  }

  input[type=file] { display: none; }

  .sheet-tabs {
    display: flex;
    gap: 6px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 4px;
    margin: 0 0 18px;
  }

  .sheet-tab {
    flex: 1;
    background: none;
    border: none;
    border-radius: 10px;
    padding: 11px 8px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    color: var(--sub);
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .sheet-tab i { margin-right: 6px; }

  .sheet-tab.active {
    background: var(--panel-raised);
    color: var(--accent);
  }

  .sheet-pane { display: none; }
  .sheet-pane.active { display: block; }

  .msg-input {
    width: 100%;
    min-height: 120px;
    max-height: 32vh;
    resize: none;
    background: var(--bg);
    color: var(--text);
    border: 1.5px solid var(--line);
    border-radius: 16px;
    padding: 14px 16px;
    font-family: inherit;
    font-size: 17px;
    line-height: 1.6;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .msg-input:focus { border-color: var(--accent-dim); }
  .msg-input::placeholder { color: var(--sub); opacity: 0.7; }

  .msg-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 12px;
  }

  .msg-hint {
    font-size: 14px;
    color: var(--sub);
    line-height: 1.4;
  }

  .send-btn {
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    border-radius: 12px;
    padding: 12px 22px;
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: opacity 0.2s ease;
  }

  .send-btn:hover { opacity: 0.85; }
  .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .send-btn i { margin-right: 6px; }

  .alert-overlay {
    position: fixed;
    inset: 0;
    background: rgba(var(--scrim-rgb), 0.78);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 40;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .alert-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .alert-box {
    width: 100%;
    max-width: 480px;
    max-height: 82vh;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--accent-dim);
    border-radius: 22px;
    padding: 22px 22px 18px;
    box-shadow: 0 0 40px rgba(var(--accent-rgb), 0.12), 0 20px 60px rgba(var(--shadow-rgb), 0.5);
    transform: translateY(14px) scale(0.96);
    transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.3, 1);
  }

  .alert-overlay.open .alert-box { transform: translateY(0) scale(1); }

  .alert-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  .alert-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--panel-raised);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .alert-from {
    font-size: 15px;
    color: var(--sub);
    line-height: 1.4;
    min-width: 0;
  }

  .alert-from strong {
    display: block;
    font-size: 18px;
    color: var(--accent);
    font-weight: 700;
  }

  .alert-count {
    margin-left: auto;
    font-size: 14px;
    color: var(--sub);
    background: var(--panel-raised);
    border-radius: 999px;
    padding: 4px 12px;
    flex-shrink: 0;
  }

  .alert-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 18px;
    line-height: 1.7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .alert-body a {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-color: var(--accent-dim);
    text-underline-offset: 3px;
    background: rgba(var(--accent-rgb), 0.1);
    border-radius: 6px;
    padding: 1px 4px;
    margin: 0 -1px;
    -webkit-tap-highlight-color: rgba(var(--accent-rgb), 0.25);
  }

  .alert-body a:active { background: rgba(var(--accent-rgb), 0.28); }

  .alert-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }

  .alert-btn {
    flex: 1;
    background: var(--panel-raised);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 13px 10px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s ease, background 0.2s ease;
  }

  .alert-btn { white-space: nowrap; }
  .alert-btn i { margin-right: 6px; }
  .alert-btn:hover { opacity: 0.85; }

  .alert-btn.primary {
    background: var(--accent);
    color: var(--on-accent);
    border-color: var(--accent);
    font-weight: 700;
  }

  .alert-btn.done {
    background: var(--accent-dim);
    color: var(--on-accent);
    border-color: var(--accent-dim);
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translate(-50%, 20px);
    background: var(--panel-raised);
    color: var(--text);
    border: 1px solid var(--accent-dim);
    border-radius: 999px;
    padding: 11px 20px;
    font-size: 16px;
    z-index: 60;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .toast i { color: var(--accent); margin-right: 8px; }

  @media (max-width: 480px) {
    header { padding: 14px 18px 2px; }
    header h1 { font-size: 26px; }
    header p { font-size: 14px; line-height: 1.5; }
    .status-row { font-size: 14px; margin-top: 6px; }
    .empty-hint { font-size: 16px; }
    .peer-node { width: 108px; height: 108px; margin-left: -54px; margin-top: -54px; }
    .peer-node .peer-name { font-size: 14px; }
  }

  @media (max-height: 640px) {
    header p { display: none; }
    header { padding-top: 12px; }
    #log { max-height: 150px; }
  }
</style>
</head>
<body>

<main>
  <div id="field">
    <div class="empty-hint" id="emptyHint">

<div id="log"></div>

<div class="alert-overlay" id="alertOverlay" role="alertdialog" aria-modal="true" aria-labelledby="alertFromName">

      <span class="alert-count" id="alertCount" hidden></span>
    </div>
    <div class="alert-body" id="alertBody"></div>
    <div class="alert-actions">

      <button class="alert-btn primary" id="alertClose" type="button">閉じる</button>
    </div>

</div>

<div class="toast" id="toast"><i class="fa-solid fa-circle-check"></i><span id="toastText"></span></div>

<div class="overlay" id="qrOverlay">
  <div class="sheet qr-sheet">
    <div class="sheet-header"><div class="sheet-handle"></div></div>
    <h2>QRコードを表示</h2>
    <p class="desc">他の端末のカメラで読み取ると、このページが開きます。</p>
    <div class="qr-box" id="qrBox"></div>
    <div class="qr-url" id="qrUrl"></div>
    <button class="sheet-close" id="qrClose">閉じる</button>

</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-header"><div class="sheet-handle"></div></div>
    <h2><span class="to-name" id="sheetToName" style="white-space:nowrap">端末</span><span style="white-space:nowrap" id="sheetTitleTail">にファイルを送る</span></h2>
    <div class="sheet-tabs">
      <button class="sheet-tab active" id="tabFile" type="button"><i class="fa-regular fa-file"></i>ファイル</button>
      <button class="sheet-tab" id="tabMsg" type="button"><i class="fa-regular fa-comment-dots"></i>メッセージ</button>

      </div>
    </div>
    <button class="sheet-close" id="sheetClose">閉じる</button>
  </div>
</div>

<script>
const SIGNALING_URL = (() => {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  return proto + "//simple-drop.user-x45.workers.dev/ws";
})();

const CHUNK_SIZE = 16 * 1024;

const ADJECTIVE_LIST = [
  "静かな", "素早い", "明るい", "涼しい", "温かい", "小さな", "大きな", "遠い",
  "近い", "澄んだ", "柔らかい", "鋭い", "陽気な", "穏やかな", "軽やかな", "力強い"
];

let ws = null;
let myId = null;
let myName = null;
let serverAssignedName = null;
const NAME_STORAGE_KEY = "simpledrop-my-name";
let customName = localStorage.getItem(NAME_STORAGE_KEY);
const peers = new Map();
const peerNodeEls = new Map();
let activeTargetId = null;

const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");
const youNameEl = document.getElementById("youName");

youNameEl.addEventListener("click", () => {
  if (youNameEl.querySelector("input")) return;
  const current = myName || "";
  const input = document.createElement("input");
  input.type = "text";
  input.className = "name-input";
  input.maxLength = 20;
  input.value = current;
  youNameEl.textContent = "";
  youNameEl.appendChild(input);
  input.focus();
  input.select();

  const commit = () => {
    const value = input.value.trim();
    if (!value) {
      localStorage.removeItem(NAME_STORAGE_KEY);
      customName = null;
      const resetName = serverAssignedName || "—";
      const changed = resetName !== myName;
      myName = resetName;
      youNameEl.textContent = myName;
      if (changed && ws && ws.readyState === WebSocket.OPEN) {
        try {
          ws.send(JSON.stringify({ type: "rename", name: resetName }));
        } catch (err) {}
      }
      showToast("名前をリセットしました");
      return;
    }
    youNameEl.textContent = myName || "—";
    if (value === myName) return;
    customName = value;
    localStorage.setItem(NAME_STORAGE_KEY, value);
    myName = value;
    youNameEl.textContent = value;
    if (ws && ws.readyState === WebSocket.OPEN) {
      try {
        ws.send(JSON.stringify({ type: "rename", name: value }));
      } catch (err) {}
    }
    showToast("名前を変更しました");
  };

  input.addEventListener("blur", commit);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") input.blur();
    if (e.key === "Escape") {
      input.value = current;
      input.blur();
    }
  });
});
const field = document.getElementById("field");
const emptyHint = document.getElementById("emptyHint");
const logEl = document.getElementById("log");
const qrBtn = document.getElementById("qrBtn");
const qrOverlay = document.getElementById("qrOverlay");
const qrClose = document.getElementById("qrClose");
const qrBox = document.getElementById("qrBox");
const qrUrl = document.getElementById("qrUrl");
let qrRendered = false;

function openQr() {
  if (!qrRendered) {
    qrBox.replaceChildren();
    new QRCode(qrBox, {
      text: location.href,
      width: 200,
      height: 200,
      colorDark: "#14231B",
      colorLight: "#FFFFFF",
      correctLevel: QRCode.CorrectLevel.M
    });
    qrUrl.textContent = location.href;
    qrRendered = true;
  }
  qrOverlay.classList.add("open");
}

function closeQr() {
  qrOverlay.classList.remove("open");
}

qrBtn.addEventListener("click", openQr);
qrClose.addEventListener("click", closeQr);
qrOverlay.addEventListener("click", (e) => {
  if (e.target === qrOverlay) closeQr();
});

function bindSheetSwipeToClose(handleEl, sheetEl, closeFn) {
  let startY = 0;
  let currentY = 0;
  let dragging = false;

  const isDesktop = () => window.matchMedia("(min-width: 769px)").matches;
  const overlayEl = sheetEl.closest(".overlay");
  const maxDelta = 240;
  const baseBlur = overlayEl ? parseFloat(getComputedStyle(overlayEl).backdropFilter.replace(/[^0-9.]/g, "")) || 6 : 6;
  const baseScrimAlpha = 0.72;

  function onStart(clientY) {
    if (isDesktop()) return;
    dragging = true;
    startY = clientY;
    currentY = clientY;
    sheetEl.style.transition = "none";
    if (overlayEl) overlayEl.style.transition = "none";
  }

  function onMove(clientY) {
    if (!dragging) return;
    currentY = clientY;
    const delta = Math.max(0, currentY - startY);
    sheetEl.style.transform = `translateY(${delta}px)`;
    if (overlayEl) {
      const ratio = Math.min(delta / maxDelta, 1);
      const blur = baseBlur * (1 - ratio);
      overlayEl.style.backdropFilter = `blur(${blur}px)`;
      overlayEl.style.webkitBackdropFilter = `blur(${blur}px)`;
      const scrimAlpha = baseScrimAlpha * (1 - ratio);
      overlayEl.style.background = `rgba(var(--scrim-rgb), ${scrimAlpha})`;
    }
  }

  function onEnd() {
    if (!dragging) return;
    dragging = false;
    sheetEl.style.transition = "";
    const delta = Math.max(0, currentY - startY);
    sheetEl.style.transform = "";
    if (delta > 80) {
      if (overlayEl) {
        overlayEl.style.transition = "";
        const clearOverlayStyles = () => {
          overlayEl.style.backdropFilter = "";
          overlayEl.style.webkitBackdropFilter = "";
          overlayEl.style.background = "";
        };
        overlayEl.addEventListener("transitionend", clearOverlayStyles, { once: true });
      }
      closeFn();
    } else {
      if (overlayEl) {
        overlayEl.style.transition = "";
        overlayEl.style.backdropFilter = "";
        overlayEl.style.webkitBackdropFilter = "";
        overlayEl.style.background = "";
      }
    }
  }

  handleEl.addEventListener("touchstart", (e) => onStart(e.touches[0].clientY), { passive: true });
  handleEl.addEventListener("touchmove", (e) => onMove(e.touches[0].clientY), { passive: true });
  handleEl.addEventListener("touchend", onEnd);
  handleEl.addEventListener("touchcancel", onEnd);

  handleEl.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "touch") return;
    onStart(e.clientY);
    handleEl.setPointerCapture(e.pointerId);
  });
  handleEl.addEventListener("pointermove", (e) => {
    if (e.pointerType === "touch") return;
    onMove(e.clientY);
  });
  handleEl.addEventListener("pointerup", (e) => {
    if (e.pointerType === "touch") return;
    onEnd();
  });
}

const overlay = document.getElementById("overlay");
const sheetToName = document.getElementById("sheetToName");
const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
const sheetClose = document.getElementById("sheetClose");
const sheetTitleTail = document.getElementById("sheetTitleTail");
const tabFile = document.getElementById("tabFile");
const tabMsg = document.getElementById("tabMsg");
const paneFile = document.getElementById("paneFile");
const paneMsg = document.getElementById("paneMsg");
const msgInput = document.getElementById("msgInput");
const msgSend = document.getElementById("msgSend");
const alertOverlay = document.getElementById("alertOverlay");
const alertFromName = document.getElementById("alertFromName");
const alertCount = document.getElementById("alertCount");
const alertBody = document.getElementById("alertBody");
const alertCopy = document.getElementById("alertCopy");
const alertClose = document.getElementById("alertClose");
const toastEl = document.getElementById("toast");
const toastText = document.getElementById("toastText");

let intentionalClose = false;
let reconnectTimer = null;
let heartbeatTimer = null;
let watchdogTimer = null;
let lastServerMessageAt = 0;
let reconnectAttempts = 0;

const HEARTBEAT_INTERVAL_MS = 4000;
const SERVER_TIMEOUT_MS = 10000;
const WATCHDOG_INTERVAL_MS = 2000;

function stopMonitors() {
  clearInterval(heartbeatTimer);
  clearInterval(watchdogTimer);
  heartbeatTimer = null;
  watchdogTimer = null;
}

function startMonitors(socket) {
  stopMonitors();
  lastServerMessageAt = Date.now();

  heartbeatTimer = setInterval(() => {
    if (ws !== socket || socket.readyState !== WebSocket.OPEN) return;
    try {
      socket.send(JSON.stringify({ type: "ping", t: Date.now() }));
    } catch (err) {
      socket.close();
    }
  }, HEARTBEAT_INTERVAL_MS);

  watchdogTimer = setInterval(() => {
    if (ws !== socket || socket.readyState !== WebSocket.OPEN) return;
    if (Date.now() - lastServerMessageAt > SERVER_TIMEOUT_MS) {
      socket.close();
    }
  }, WATCHDOG_INTERVAL_MS);
}

function clearAllPeers() {
  Array.from(peers.keys()).forEach((id) => removePeer(id));
  peers.clear();
}

function closeAllConnections() {
  connections.forEach((conn) => {
    if (conn.incoming) {
      markCardFailed(conn.incoming.card, `${conn.peerName}との接続が切断されました`);
      conn.incoming = null;
      decActiveTransfers();
    }
    if (conn.outgoing) {
      markCardFailed(conn.outgoing.card, `${conn.peerName}との接続が切断されました`);
      conn.outgoing = null;
      decActiveTransfers();
    }
    try {
      conn.pc.close();
    } catch (err) {}
  });
  connections.clear();
}

function scheduleReconnect() {
  clearTimeout(reconnectTimer);
  const delay = Math.min(500 * Math.pow(2, reconnectAttempts), 5000);
  reconnectAttempts += 1;
  reconnectTimer = setTimeout(connect, delay);
}

function connect() {
  if (document.hidden) return;
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;

  intentionalClose = false;
  const socket = new WebSocket(SIGNALING_URL);
  ws = socket;
  statusText.textContent = "接続しています…";

  socket.addEventListener("open", () => {
    if (ws !== socket) return;
    reconnectAttempts = 0;
    statusDot.classList.add("connected");
    statusText.textContent = "接続中";
    startMonitors(socket);
  });

  socket.addEventListener("close", () => {
    if (ws !== socket) return;
    stopMonitors();
    statusDot.classList.remove("connected");
    youNameEl.textContent = "";
    myId = null;
    myName = null;
    closeAllConnections();
    clearAllPeers();
    if (intentionalClose) {
      statusText.textContent = "非表示のため切断しました";
      return;
    }
    statusText.textContent = "切断されました。再接続しています…";
    scheduleReconnect();
  });

  socket.addEventListener("error", () => {
    if (ws !== socket) return;
    socket.close();
  });

  socket.addEventListener("message", (event) => {
    if (ws !== socket) return;
    lastServerMessageAt = Date.now();
    let data;
    try {
      data = JSON.parse(event.data);
    } catch (err) {
      return;
    }
    handleSignalingMessage(data);
  });
}

function disconnect() {
  intentionalClose = true;
  clearTimeout(reconnectTimer);
  stopMonitors();
  const socket = ws;
  if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
    socket.close();
  }
  statusDot.classList.remove("connected");
  statusText.textContent = "非表示のため切断しました";
  youNameEl.textContent = "";
  myId = null;
  myName = null;
  closeAllConnections();
  clearAllPeers();
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    disconnect();
  } else {
    reconnectAttempts = 0;
    connect();
  }
});

window.addEventListener("pagehide", () => {
  intentionalClose = true;
  clearTimeout(reconnectTimer);
  stopMonitors();
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
    ws.close(1000, "pagehide");
  }
});

window.addEventListener("pageshow", (event) => {
  if (event.persisted && !document.hidden) {
    reconnectAttempts = 0;
    connect();
  }
});

window.addEventListener("offline", () => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.close();
  } else {
    stopMonitors();
    statusDot.classList.remove("connected");
    statusText.textContent = "オフラインです";
    closeAllConnections();
    clearAllPeers();
  }
});

window.addEventListener("online", () => {
  clearTimeout(reconnectTimer);
  reconnectAttempts = 0;
  connect();
});

function handleSignalingMessage(data) {
  if (data.type === "ping") {
    try {
      ws.send(JSON.stringify({ type: "pong" }));
    } catch (err) {}
    return;
  }
  if (data.type === "pong") {
    return;
  }
  if (data.type === "welcome") {
    myId = data.id;
    serverAssignedName = data.name;
    myName = customName || data.name;
    youNameEl.textContent = myName;
    if (customName) {
      try {
        ws.send(JSON.stringify({ type: "rename", name: customName }));
      } catch (err) {}
    }
  } else if (data.type === "peer-list") {
    const liveIds = new Set(data.peers.map((p) => p.id));
    Array.from(peers.keys()).forEach((id) => {
      if (!liveIds.has(id)) removePeer(id);
    });
    data.peers.forEach((p) => addPeer(p.id, p.name));
  } else if (data.type === "peer-joined") {
    addPeer(data.id, data.name);
  } else if (data.type === "peer-left") {
    removePeer(data.id);
  } else if (data.type === "peer-renamed") {
    renamePeer(data.id, data.name);
  } else if (data.type === "signal") {
    handlePeerSignal(data.from, data.fromName, data.payload);
  }
}

function addPeer(id, name) {
  if (peers.has(id)) return;
  peers.set(id, { id, name });
  renderPeerNode(id, name);
  emptyHint.style.display = "none";
}

function renamePeer(id, name) {
  const peer = peers.get(id);
  if (!peer) return;
  peer.name = name;
  const el = peerNodeEls.get(id);
  if (el) {
    const nameEl = el.querySelector(".peer-name");
    if (nameEl) nameEl.textContent = name;
  }
  const conn = connections.get(id);
  if (conn) conn.peerName = name;
}

function removePeer(id) {
  peers.delete(id);
  const el = peerNodeEls.get(id);
  if (el) {
    el.classList.add("leaving");
    setTimeout(() => el.remove(), 500);
    peerNodeEls.delete(id);
  }
  if (peers.size === 0) {
    emptyHint.style.display = "flex";
  }
  const conn = connections.get(id);
  if (conn) {
    if (conn.incoming) {
      markCardFailed(conn.incoming.card, `${conn.peerName}との接続が切断されました`);
      conn.incoming = null;
    }
    if (conn.outgoing) {
      markCardFailed(conn.outgoing.card, `${conn.peerName}との接続が切断されました`);
      conn.outgoing = null;
    }
    conn.pc.close();
    connections.delete(id);
  }
}

function nodeSize() {
  return window.innerWidth <= 480 ? 108 : 128;
}

function pickPosition() {
  const size = nodeSize();
  const half = size / 2;
  const w = field.clientWidth || 560;
  const h = field.clientHeight || 420;
  const minX = half + 6;
  const maxX = Math.max(w - half - 6, minX);
  const minY = half + 14;
  const maxY = Math.max(h - half - 14, minY);
  const minDist = size + 8;

  let best = null;
  let bestScore = -1;
  for (let i = 0; i < 40; i++) {
    const x = minX + Math.random() * (maxX - minX);
    const y = minY + Math.random() * (maxY - minY);
    let nearest = Infinity;
    peerNodeEls.forEach((other) => {
      const ox = parseFloat(other.style.left);
      const oy = parseFloat(other.style.top);
      nearest = Math.min(nearest, Math.hypot(x - ox, y - oy));
    });
    if (nearest >= minDist) return { x, y };
    if (nearest > bestScore) {
      bestScore = nearest;
      best = { x, y };
    }
  }
  return best;
}

function renderPeerNode(id, name) {
  const el = document.createElement("div");
  el.className = "peer-node";
  const pos = pickPosition();
  el.style.left = pos.x + "px";
  el.style.top = pos.y + "px";
  el.style.setProperty("--drift-delay", (Math.random() * 3) + "s");
  el.innerHTML = '<div class="glow"></div><div class="peer-name"></div>';
  const nameEl = el.querySelector(".peer-name");
  const adj = ADJECTIVE_LIST.find((a) => name.startsWith(a));
  const rest = adj ? name.slice(adj.length) : name;
  const numMatch = rest.match(/^(.*?)(\d+)$/);
  const lines = adj ? [adj] : [];
  if (numMatch) {
    lines.push(numMatch[1], numMatch[2]);
  } else {
    lines.push(rest);
  }
  lines.filter(Boolean).forEach((line, i) => {
    if (i > 0) nameEl.appendChild(document.createElement("br"));
    nameEl.appendChild(document.createTextNode(line));
  });
  bindPeerGestures(el, id, name);
  field.appendChild(el);
  peerNodeEls.set(id, el);
}

const LONG_PRESS_MS = 500;
const MOVE_TOLERANCE = 10;

function bindPeerGestures(el, id, name) {
  let timer = null;
  let startX = 0;
  let startY = 0;
  let longPressed = false;

  const cancel = () => {
    clearTimeout(timer);
    timer = null;
    el.classList.remove("pressing");
  };

  el.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    longPressed = false;
    startX = e.clientX;
    startY = e.clientY;
    el.classList.add("pressing");
    clearTimeout(timer);
    timer = setTimeout(() => {
      timer = null;
      longPressed = true;
      el.classList.remove("pressing");
      if (navigator.vibrate) navigator.vibrate(30);
      openSheet(id, name, "message");
    }, LONG_PRESS_MS);
  });

  el.addEventListener("pointermove", (e) => {
    if (timer && Math.hypot(e.clientX - startX, e.clientY - startY) > MOVE_TOLERANCE) cancel();
  });

  ["pointerup", "pointercancel", "pointerleave"].forEach((type) => {
    el.addEventListener(type, cancel);
  });

  el.addEventListener("contextmenu", (e) => e.preventDefault());

  el.addEventListener("click", () => {
    if (longPressed) {
      longPressed = false;
      return;
    }
    openSheet(id, name, "file");
  });
}

function setSheetMode(mode) {
  const isMsg = mode === "message";
  tabFile.classList.toggle("active", !isMsg);
  tabMsg.classList.toggle("active", isMsg);
  paneFile.classList.toggle("active", !isMsg);
  paneMsg.classList.toggle("active", isMsg);
  sheetTitleTail.textContent = isMsg ? "にメッセージを送る" : "にファイルを送る";
}

function openSheet(id, name, mode) {
  activeTargetId = id;
  sheetToName.textContent = name;
  setSheetMode(mode);
  overlay.classList.add("open");
  if (mode === "message") {
    setTimeout(() => msgInput.focus(), 320);
  }
}

function openUploadSheet(id, name) {
  openSheet(id, name, "file");
}

function closeUploadSheet() {
  overlay.classList.remove("open");
  msgInput.blur();
  activeTargetId = null;
}

tabFile.addEventListener("click", () => setSheetMode("file"));
tabMsg.addEventListener("click", () => {
  setSheetMode("message");
  setTimeout(() => msgInput.focus(), 50);
});

function autoGrow() {
  msgInput.style.height = "auto";
  msgInput.style.height = Math.min(msgInput.scrollHeight + 2, window.innerHeight * 0.32) + "px";
}

msgInput.addEventListener("input", () => {
  msgSend.disabled = msgInput.value.trim().length === 0;
  autoGrow();
});

msgInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
    e.preventDefault();
    submitMessage();
  }
});

msgSend.addEventListener("click", submitMessage);

function submitMessage() {
  const text = msgInput.value.replace(/\r\n/g, "\n").replace(/\s+$/, "");
  if (!text.trim() || !activeTargetId) return;
  const targetId = activeTargetId;
  const targetName = peers.get(targetId)?.name || "端末";
  sendMessage(targetId, text)
    .then(() => showToast(`${targetName}に送信しました`))
    .catch(() => showToast("送信できませんでした", true));
  msgInput.value = "";
  msgInput.style.height = "auto";
  msgSend.disabled = true;
  closeUploadSheet();
}

sheetClose.addEventListener("click", closeUploadSheet);
overlay.addEventListener("click", (e) => {
  if (e.target === overlay) closeUploadSheet();
});

dropZone.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", () => {
  if (fileInput.files.length > 0) {
    sendFile(activeTargetId, fileInput.files[0]);
    closeUploadSheet();
    fileInput.value = "";
  }
});

dropZone.addEventListener("dragover", (e) => {
  e.preventDefault();
  dropZone.classList.add("dragover");
});

dropZone.addEventListener("dragleave", () => {
  dropZone.classList.remove("dragover");
});

dropZone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropZone.classList.remove("dragover");
  if (e.dataTransfer.files.length > 0) {
    sendFile(activeTargetId, e.dataTransfer.files[0]);
    closeUploadSheet();
  }
});

const connections = new Map();
let activeTransferCount = 0;
const transferWarning = document.getElementById("transferWarning");

function incActiveTransfers() {
  activeTransferCount++;
  transferWarning.hidden = false;
}

function decActiveTransfers() {
  activeTransferCount = Math.max(0, activeTransferCount - 1);
  if (activeTransferCount === 0) transferWarning.hidden = true;
}

window.addEventListener("beforeunload", (e) => {
  if (activeTransferCount > 0) {
    e.preventDefault();
    e.returnValue = "";
    return "";
  }
});

function getOrCreateConnection(peerId, peerName) {
  if (connections.has(peerId)) return connections.get(peerId);

  const pc = new RTCPeerConnection({
    iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
  });

  const entry = { pc, dataChannel: null, peerName, incoming: null, outgoing: null };
  connections.set(peerId, entry);

  pc.addEventListener("icecandidate", (event) => {
    if (event.candidate) {
      sendSignal(peerId, { kind: "ice", candidate: event.candidate });
    }
  });

  pc.addEventListener("datachannel", (event) => {
    entry.dataChannel = event.channel;
    setupDataChannel(entry, peerId);
  });

  return entry;
}

function sendSignal(to, payload) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: "signal", to, payload }));
}

function ensureChannel(peerId) {
  const peerName = peers.get(peerId)?.name || "端末";
  const entry = getOrCreateConnection(peerId, peerName);

  if (entry.dataChannel && entry.dataChannel.readyState === "open") {
    return Promise.resolve(entry);
  }
  if (entry.opening) return entry.opening;

  if (!entry.dataChannel || entry.dataChannel.readyState === "closed" || entry.dataChannel.readyState === "closing") {
    const dc = entry.pc.createDataChannel("file");
    entry.dataChannel = dc;
    setupDataChannel(entry, peerId);
  }

  const dc = entry.dataChannel;
  const alreadyNegotiated = entry.negotiated === true;

  entry.opening = new Promise((resolve, reject) => {
    const timeout = setTimeout(() => {
      entry.opening = null;
      reject(new Error("timeout"));
    }, 15000);
    dc.addEventListener("open", () => {
      clearTimeout(timeout);
      entry.opening = null;
      resolve(entry);
    }, { once: true });
    dc.addEventListener("close", () => {
      clearTimeout(timeout);
      entry.opening = null;
      reject(new Error("closed"));
    }, { once: true });
  });

  if (!alreadyNegotiated) {
    entry.negotiated = true;
    entry.pc.createOffer()
      .then((offer) => entry.pc.setLocalDescription(offer).then(() => offer))
      .then((offer) => sendSignal(peerId, { kind: "offer", sdp: offer }))
      .catch(() => {
        entry.negotiated = false;
      });
  }

  return entry.opening;
}

async function sendFile(peerId, file) {
  let entry;
  try {
    entry = await ensureChannel(peerId);
  } catch (err) {
    showToast("接続できませんでした", true);
    return;
  }
  const card = createTransferCard(file.name, file.size, "送信中", true, file.type);
  attachPreview(card, file.name, file.type, file);
  beginSending(entry, file, card);
}

async function sendMessage(peerId, text) {
  const entry = await ensureChannel(peerId);
  entry.dataChannel.send(JSON.stringify({ message: true, text, sentAt: Date.now() }));
}

function beginSending(entry, file, card) {
  const dc = entry.dataChannel;
  const fill = card.querySelector(".progress-fill");
  entry.outgoing = { card };
  incActiveTransfers();

  let offset = 0;
  const reader = new FileReader();

  function fail(message) {
    entry.outgoing = null;
    decActiveTransfers();
    markCardFailed(card, message);
  }

  function readSlice() {
    const slice = file.slice(offset, offset + CHUNK_SIZE);
    reader.readAsArrayBuffer(slice);
  }

  reader.addEventListener("error", () => {
    fail("ファイルの読み込みに失敗しました");
  });

  reader.addEventListener("load", () => {
    try {
      dc.send(reader.result);
    } catch (err) {
      fail(`${entry.peerName}への送信に失敗しました`);
      return;
    }
    offset += reader.result.byteLength;
    const pct = Math.min(100, Math.round((offset / file.size) * 100));
    fill.style.width = pct + "%";
    if (offset < file.size) {
      if (dc.bufferedAmount > 8 * CHUNK_SIZE) {
        setTimeout(readSlice, 30);
      } else {
        readSlice();
      }
    } else {
      entry.outgoing = null;
      decActiveTransfers();
      card.querySelector(".fmeta").textContent = "送信完了";
      addCloseButton(card);
    }
  });

  try {
    dc.send(JSON.stringify({ meta: true, name: file.name, size: file.size, mime: file.type }));
  } catch (err) {
    fail(`${entry.peerName}への送信に失敗しました`);
    return;
  }

  readSlice();
}

async function handlePeerSignal(fromId, fromName, payload) {
  const entry = getOrCreateConnection(fromId, fromName);
  const pc = entry.pc;

  if (payload.kind === "offer") {
    await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    sendSignal(fromId, { kind: "answer", sdp: answer });
  } else if (payload.kind === "answer") {
    await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
  } else if (payload.kind === "ice") {
    try {
      await pc.addIceCandidate(payload.candidate);
    } catch (err) {}
  }
}

function setupDataChannel(entry, peerId) {
  const dc = entry.dataChannel;
  dc.binaryType = "arraybuffer";

  const markInterrupted = () => {
    const inc = entry.incoming;
    if (inc) {
      entry.incoming = null;
      decActiveTransfers();
      markCardFailed(inc.card, `${entry.peerName}との接続が切断されました`);
    }
    const out = entry.outgoing;
    if (out) {
      entry.outgoing = null;
      decActiveTransfers();
      markCardFailed(out.card, `${entry.peerName}との接続が切断されました`);
    }
  };

  dc.addEventListener("close", markInterrupted);
  dc.addEventListener("error", markInterrupted);

  dc.addEventListener("message", (event) => {
    if (typeof event.data === "string") {
      let meta;
      try {
        meta = JSON.parse(event.data);
      } catch (err) {
        return;
      }
      if (meta.message && typeof meta.text === "string") {
        enqueueAlert(entry.peerName, meta.text.slice(0, 5000));
        return;
      }
      if (meta.meta) {
        entry.incoming = {
          name: meta.name,
          size: meta.size,
          mime: meta.mime,
          chunks: [],
          received: 0,
          card: createTransferCard(meta.name, meta.size, `${entry.peerName}から受信中`, true, meta.mime),
        };
        incActiveTransfers();
      }
      return;
    }
    const inc = entry.incoming;
    if (!inc) return;
    inc.chunks.push(event.data);
    inc.received += event.data.byteLength;
    const pct = Math.min(100, Math.round((inc.received / inc.size) * 100));
    inc.card.querySelector(".progress-fill").style.width = pct + "%";
    if (inc.received >= inc.size) {
      finalizeIncoming(inc, entry.peerName);
      entry.incoming = null;
      decActiveTransfers();
    }
  });
}

function markCardFailed(card, message) {
  const fmeta = card.querySelector(".fmeta");
  if (fmeta) fmeta.textContent = message;
  const track = card.querySelector(".progress-track");
  if (track) {
    track.classList.add("failed");
  }
  card.classList.add("transfer-failed");
  const icon = card.querySelector(".transfer-icon");
  if (icon) {
    icon.replaceChildren();
    const i = document.createElement("i");
    i.className = "fa-solid fa-triangle-exclamation";
    icon.appendChild(i);
  }
  addCloseButton(card);
}

function finalizeIncoming(inc, peerName) {
  const blob = new Blob(inc.chunks, { type: inc.mime || "application/octet-stream" });
  const url = URL.createObjectURL(blob);
  const card = inc.card;
  attachPreview(card, inc.name, inc.mime, blob);
  card.querySelector(".fmeta").textContent = `${peerName}から受信完了`;
  const track = card.querySelector(".progress-track");
  if (track) track.remove();

  const dlBtn = document.createElement("button");
  dlBtn.className = "dl-btn";
  dlBtn.innerHTML = '<i class="fa-solid fa-download"></i> 保存する';
  dlBtn.addEventListener("click", () => {
    const a = document.createElement("a");
    a.href = url;
    a.download = inc.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    addCloseButton(card);
  });
  card.appendChild(dlBtn);
}

const IMAGE_EXTS = ["jpg", "jpeg", "png", "gif", "webp", "avif", "bmp", "svg", "heic", "heif"];
const VIDEO_EXTS = ["mp4", "mov", "webm", "m4v", "avi", "mkv", "ogv"];

function extOf(name) {
  const i = name.lastIndexOf(".");
  return i === -1 ? "" : name.slice(i + 1).toLowerCase();
}

function kindOf(name, mime) {
  const ext = extOf(name);
  if ((mime && mime.startsWith("image/")) || IMAGE_EXTS.includes(ext)) return "image";
  if ((mime && mime.startsWith("video/")) || VIDEO_EXTS.includes(ext)) return "video";
  return "file";
}

function faIconFor(name, mime) {
  const kind = kindOf(name, mime);
  const ext = extOf(name);
  if (kind === "image") return "fa-regular fa-image";
  if (kind === "video") return "fa-solid fa-film";
  if (ext === "pdf") return "fa-regular fa-file-pdf";
  if (["doc", "docx"].includes(ext)) return "fa-regular fa-file-word";
  if (["xls", "xlsx", "csv"].includes(ext)) return "fa-regular fa-file-excel";
  if (["ppt", "pptx", "key"].includes(ext)) return "fa-regular fa-file-powerpoint";
  if (["zip", "rar", "7z", "tar", "gz"].includes(ext)) return "fa-regular fa-file-zipper";
  if (["mp3", "wav", "m4a", "flac", "aac", "ogg"].includes(ext)) return "fa-regular fa-file-audio";
  if (["txt", "md", "rtf"].includes(ext)) return "fa-regular fa-file-lines";
  if (["js", "ts", "html", "css", "json", "py", "java", "c", "cpp", "go", "rs", "sh"].includes(ext)) return "fa-regular fa-file-code";
  return "fa-regular fa-file";
}

function setIcon(iconEl, name, mime) {
  iconEl.replaceChildren();
  const i = document.createElement("i");
  i.className = faIconFor(name, mime);
  iconEl.appendChild(i);
}

function attachPreview(card, name, mime, source) {
  const iconEl = card.querySelector(".transfer-icon");
  const kind = kindOf(name, mime);
  if (kind === "file") return null;

  const url = URL.createObjectURL(source);
  const fallback = () => setIcon(iconEl, name, mime);

  if (kind === "image") {
    const img = document.createElement("img");
    img.alt = "";
    img.addEventListener("load", () => {
      iconEl.replaceChildren(img);
    });
    img.addEventListener("error", fallback);
    img.src = url;
  } else {
    const video = document.createElement("video");
    video.muted = true;
    video.playsInline = true;
    video.preload = "metadata";
    video.addEventListener("loadeddata", () => {
      iconEl.replaceChildren(video);
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.innerHTML = '<i class="fa-solid fa-play"></i>';
      iconEl.appendChild(badge);
    });
    video.addEventListener("error", fallback);
    video.src = url + "#t=0.1";
  }
  return url;
}

const URL_PATTERN = /(?:https?:\/\/|www\.)[A-Za-z0-9\-._~:\/?#\[\]@!$&'()*+,;=%]+/gi;
const TRAILING_PUNCT = /[.,;:!?'*]+$/;

function trimUrl(raw) {
  let out = raw;
  for (;;) {
    const before = out;
    out = out.replace(TRAILING_PUNCT, "");
    if (out.endsWith(")") && (out.match(/\(/g) || []).length < (out.match(/\)/g) || []).length) {
      out = out.slice(0, -1);
    }
    if (out === before) break;
  }
  return out;
}

function linkify(container, text) {
  container.textContent = "";
  let last = 0;
  let m;
  URL_PATTERN.lastIndex = 0;
  while ((m = URL_PATTERN.exec(text)) !== null) {
    const raw = trimUrl(m[0]);
    if (!raw || raw.length < 5) continue;

    if (m.index > last) {
      container.appendChild(document.createTextNode(text.slice(last, m.index)));
    }

    const href = /^https?:\/\//i.test(raw) ? raw : "https://" + raw;
    let safe = null;
    try {
      const u = new URL(href);
      if ((u.protocol === "http:" || u.protocol === "https:") && u.hostname.includes(".")) safe = u.href;
    } catch (err) {}

    if (safe) {
      const a = document.createElement("a");
      a.href = safe;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = raw;
      container.appendChild(a);
    } else {
      container.appendChild(document.createTextNode(raw));
    }

    const consumedEnd = m.index + raw.length;
    last = consumedEnd;
    URL_PATTERN.lastIndex = consumedEnd;
  }
  if (last < text.length) {
    container.appendChild(document.createTextNode(text.slice(last)));
  }
}

const alertQueue = [];
let currentAlert = null;

function enqueueAlert(fromName, text) {
  alertQueue.push({ fromName, text });
  if (!currentAlert) showNextAlert();
  else updateAlertCount();
}

function updateAlertCount() {
  if (alertQueue.length > 0) {
    alertCount.hidden = false;
    alertCount.textContent = `他${alertQueue.length}件`;
  } else {
    alertCount.hidden = true;
  }
}

function showNextAlert() {
  currentAlert = alertQueue.shift() || null;
  if (!currentAlert) return;
  alertFromName.textContent = currentAlert.fromName;
  linkify(alertBody, currentAlert.text);
  alertBody.scrollTop = 0;
  resetCopyButton();
  updateAlertCount();
  alertOverlay.classList.add("open");
  if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
}

function dismissAlert() {
  alertOverlay.classList.remove("open");
  currentAlert = null;
  if (alertQueue.length > 0) {
    setTimeout(showNextAlert, 260);
  }
}

alertClose.addEventListener("click", dismissAlert);
alertOverlay.addEventListener("click", (e) => {
  if (e.target === alertOverlay) dismissAlert();
});

function resetCopyButton() {
  alertCopy.classList.remove("done");
  alertCopy.innerHTML = '<i class="fa-regular fa-copy"></i>コピー';
}

async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (err) {}
  }
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, ta.value.length);
  let ok = false;
  try {
    ok = document.execCommand("copy");
  } catch (err) {}
  ta.remove();
  return ok;
}

alertCopy.addEventListener("click", async () => {
  if (!currentAlert) return;
  const ok = await copyText(currentAlert.text);
  if (ok) {
    alertCopy.classList.add("done");
    alertCopy.innerHTML = '<i class="fa-solid fa-check"></i>コピー済み';
    showToast("クリップボードにコピーしました");
  } else {
    showToast("コピーできませんでした", true);
  }
});

let toastTimer = null;

function showToast(message, isError) {
  toastText.textContent = message;
  const icon = toastEl.querySelector("i");
  icon.className = isError ? "fa-solid fa-triangle-exclamation" : "fa-solid fa-circle-check";
  icon.style.color = isError ? "var(--warn)" : "var(--accent)";
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
}

document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (alertOverlay.classList.contains("open")) dismissAlert();
  else if (overlay.classList.contains("open")) closeUploadSheet();
  else if (qrOverlay.classList.contains("open")) closeQr();
});

function formatSize(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / (1024 * 1024)).toFixed(1) + " MB";
}

function createTransferCard(name, size, statusLabel, withProgress, mime) {
  const card = document.createElement("div");
  card.className = "transfer-card";
  card.innerHTML = `
    <div class="transfer-icon"><i class="${faIconFor(name, mime)}"></i></div>
    <div class="transfer-info">
      <div class="fname">${escapeHtml(name)}</div>
      <div class="fmeta">${statusLabel} ・ ${formatSize(size)}</div>
      ${withProgress ? '<div class="progress-track"><div class="progress-fill"></div></div>' : ""}
    </div>
  `;
  logEl.prepend(card);
  return card;
}

function addCloseButton(card) {
  if (card.querySelector(".transfer-close")) return;
  const closeBtn = document.createElement("button");
  closeBtn.className = "transfer-close";
  closeBtn.setAttribute("aria-label", "閉じる");
  closeBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
  closeBtn.addEventListener("click", () => card.remove());
  card.appendChild(closeBtn);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

bindSheetSwipeToClose(document.querySelector("#overlay .sheet-header"), overlay.querySelector(".sheet"), closeUploadSheet);
bindSheetSwipeToClose(document.querySelector("#qrOverlay .sheet-header"), qrOverlay.querySelector(".sheet"), closeQr);

if (!document.hidden) connect();
